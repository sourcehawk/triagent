name: Lint

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'Makefile'
      - '.gitignore'
      - '.tool-versions'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'Makefile'
      - '.gitignore'
      - '.tool-versions'

permissions:
  contents: read

# See the note in test.yml: collapse the push + pull_request double-trigger
# into one group per workflow so cancel-in-progress drops the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - id: tool-versions
        run: grep "golangci-lint" ".tool-versions" 2>/dev/null | awk '{ print $1"="$2 }' >> $GITHUB_OUTPUT || echo "golangci-lint=" >> $GITHUB_OUTPUT
        shell: bash

      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint-action@v9 requires a v-prefixed version
          # (e.g. v2.11.4). .tool-versions stores the bare semver, so
          # prepend the v here rather than pollute the asdf format.
          version: v${{ steps.tool-versions.outputs.golangci-lint }}
          args: --timeout 10m

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck
        run: |
          cd frontend
          npm install
          npm run typecheck
