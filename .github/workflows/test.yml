name: Test

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'Makefile'
      - '.gitignore'
      - '.tool-versions'

permissions:
  contents: read

# CI runs on pull requests only — no point validating a branch before it has an
# open PR, and dropping the push trigger removes the push + pull_request
# double-run entirely. The concurrency group still collapses rapid pushes to an
# open PR so cancel-in-progress keeps only the latest run; github.workflow keys
# it per workflow, so Test never cancels Lint.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Backend (Go race)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go build
        run: go build ./...

      - name: Test (Go race)
        run: make test-go

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test (frontend vitest)
        run: make test-frontend

      - name: Frontend build
        run: |
          cd frontend
          npm run build
