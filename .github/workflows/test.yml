name: Test

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: read

# CI runs on pull requests only. The concurrency group collapses rapid pushes
# to an open PR so cancel-in-progress keeps only the latest run. Keyed on the
# PR number (not the branch name, which collides across forks) and on
# github.workflow, so Test never cancels Lint.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Backend (Go race)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go build
        run: go build ./...

      - name: Test (Go race)
        run: make test-go

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test (frontend vitest)
        run: make test-frontend

      - name: Frontend build
        run: |
          cd frontend
          npm run build
