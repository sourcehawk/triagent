# Payments latency triage playbook (e2e fixture).
# This top-of-file comment is load-bearing for the manual-edit test:
# WriteUserPlaybook reserialises through yaml.v3, so the e2e suite pins
# the durable invariant (the edited field round-trips on disk), not
# comment preservation — playbooks are not frontmatter+body documents.
id: payments_latency
schema_version: 1
type: investigation
active: true
symptom: "Payments API p99 latency spiking past SLO during checkout"
description: |
  Walk the payments-latency triage: confirm the SLO breach, isolate the
  hot path, and decide whether it is config, capacity, or a downstream
  dependency.
entrypoint: confirm_breach
nodes:
  confirm_breach:
    description: |
      Confirm the p99 latency breach is real and ongoing before
      digging into causes. Pull the SLO dashboard and the current p99.
    expected_findings:
      - breach_confirmed
    next:
      - condition: "breach confirmed and ongoing"
        goto: isolate_hot_path
      - condition: "no breach — transient spike already recovered"
        goto: terminal_no_breach
  isolate_hot_path:
    description: |
      Identify which payments endpoint owns the latency. Compare the
      per-route latency breakdown and name the hot path.
    expected_findings:
      - hot_path
    next:
      - condition: "hot path identified"
        goto: terminal_isolated
  terminal_isolated:
    description: |
      Report the isolated hot path and the most likely cause class
      (config / capacity / downstream) so the operator can act.
    terminal_advice: |
      Summarise the confirmed breach, the hot path, and the leading
      cause class. Offer to draft a follow-up codefix or wiki entry.
  terminal_no_breach:
    description: |
      No active breach. Record the transient spike and stand down.
    terminal_advice: |
      State that the spike already recovered and no action is needed.
